name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private spot coordinates, or homelab identifiers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit, or container digest
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and additional context
      description: Include logs only after removing sensitive information.
